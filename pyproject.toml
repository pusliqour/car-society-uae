[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csae-calendar-bot"
version = "0.1.0"
description = "Approval-gated Telegram to GitHub Pages event calendar automation for CSAE"
requires-python = ">=3.9"
dependencies = [
  "python-telegram-bot>=21,<23"
]

[project.scripts]
csae-bot = "csae.bot:main"
csae-validate = "csae.validate:main"

[tool.setuptools.packages.find]
where = ["src"]
